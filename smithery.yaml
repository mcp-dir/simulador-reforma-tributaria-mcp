# Smithery configuration for Simulador da Reforma Tributária
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_simulador-reforma-tributaria

name: simulador-reforma-tributaria-mcp
displayName: "Simulador da Reforma Tributária"
description: >
  **Simulador da Reforma Tributária** para IA. Veja quanto dá de CBS, IBS e Imposto Seletivo numa operação, no regime regular e no Simples Nacional. Usa o código aberto oficial da Receita Federal (regime regular 1.6.1, Simples Nacional 0.0.6, base V0059 de 30/09/2026), sem recálculo próprio. Base V0059: só tem alíquotas de referência de 2026. Não substitui a análise do seu contador. Serviço independente, sem vínculo com a Receita Federal.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/simulador-reforma-tributaria-mcp
repository: https://github.com/mcp-dir/simulador-reforma-tributaria-mcp

tags:
  - fiscal
  - tributario
  - reforma-tributaria
  - cbs
  - ibs
  - brazil
  - tax
  - read-only
  - simulador
  - simples-nacional

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_simulador-reforma-tributaria

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_simulador-reforma-tributaria/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
